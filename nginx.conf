# nginx reverse proxy for Reflex single-container production deployment.
#
# Topology:
#   browser → nginx:2009 (external)
#     ├── /_event/*, /_upload/*, /_ping  →  granian   localhost:8000
#     └── everything else                →  Next.js   localhost:3100
#
# API_URL is baked into the frontend at image build time (set to the public
# app URL, e.g. https://<app>.azurecontainerapps.io). nginx keeps a single
# external port (2009) and routes frontend/backend traffic internally.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    log_format backend_proxy '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

    # /tmp paths required when running as non-root inside the container.
    client_body_temp_path /tmp/nginx_client_temp;
    proxy_temp_path       /tmp/nginx_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_scgi_temp;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 2009;
        server_name _;

        # ── Reflex backend routes → granian on 8000 ───────────────────────────
        # WebSocket event stream (must upgrade connection)
        location /_event/ {
            access_log /dev/stdout backend_proxy;
            proxy_pass         http://localhost:8000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
        }

        # File upload endpoint (Reflex posts to /_upload without trailing slash)
        location = /_upload {
            access_log /dev/stdout backend_proxy;
            proxy_pass       http://localhost:8000;
            proxy_set_header Host $host;
            client_max_body_size 100m;
        }

        # Keep trailing-slash variant for compatibility.
        location /_upload/ {
            access_log /dev/stdout backend_proxy;
            proxy_pass       http://localhost:8000;
            proxy_set_header Host $host;
            client_max_body_size 100m;
        }

        # Health / ping
        location = /_ping {
            access_log /dev/stdout backend_proxy;
            proxy_pass       http://localhost:8000;
            proxy_set_header Host $host;
        }

        # ── Next.js frontend → port 3100 ──────────────────────────────────────
        location / {
            proxy_pass         http://localhost:3100;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $http_connection;
            proxy_set_header   Host       $host;
        }
    }
}
