name: Publish Presentation

on:
  push:
    branches:
      - main
    paths:
      - presentation/**
      - .github/workflows/publish-presentation.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Presentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./presentation

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
