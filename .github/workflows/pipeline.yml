name: Pipeline

on:
  workflow_dispatch:
  schedule:
    # Run daily at 02:00 UTC (03:00 CET in winter; 04:00 CEST in summer).
    - cron: "0 2 * * *"

# OIDC token required for Azure Login in the deploy job.
permissions:
  id-token: write
  contents: read

jobs:
  # ── 1. Lint & Format (fast gate — fails early before heavier jobs run) ──────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

  # ── 2. Tests (matrix 3.12 + 3.13, runs after lint passes) ──────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  # ── 3a. Bandit SAST (parallel to test, after lint) ──────────────────────────
  bandit:
    name: Bandit SAST
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Bandit
        run: |
          uv run bandit -c pyproject.toml -r . -f json -o bandit-results.json || true

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.json

  # ── 3b. pip-audit CVE scan (parallel to test & bandit, after lint) ──────────
  pip-audit:
    name: pip-audit (CVE check)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pip-audit
        run: uv run pip-audit --strict

  # ── 4. Build & Deploy (only on push to main, after all checks pass) ─────────
  deploy:
    name: Build & Deploy
    needs: [test, bandit, pip-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate to Azure via OIDC — no stored service principal secrets.
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure CLI containerapp extension
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name containerapp --upgrade

      - name: Ensure Container App system identity
        run: |
          APP="${{ secrets.AZURE_CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          PRINCIPAL_ID=$(az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query "identity.principalId" \
            -o tsv)

          if [[ -n "$PRINCIPAL_ID" && "$PRINCIPAL_ID" != "None" ]]; then
            echo "System-assigned identity already present: $PRINCIPAL_ID"
          else
            echo "Assigning system-assigned identity..."
            az containerapp identity assign \
              --name "$APP" \
              --resource-group "$RG" \
              --system-assigned
          fi

      # Build the Dockerfile inside ACR — no Docker daemon needed on the runner.
      # API_URL is the public HTTPS FQDN of the Container App; baked into the
      # JS bundle so the browser constructs correct WebSocket URLs.
      - name: Build & push image to ACR
        run: |
          FQDN=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          if [[ -z "$FQDN" ]]; then
            echo "ERROR: Container App ingress FQDN is empty. Ensure ingress is enabled before deployment."
            exit 1
          fi
          echo "Container App FQDN: $FQDN"
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "pp-agent-toolkit:${{ github.sha }}" \
            --image "pp-agent-toolkit:latest" \
            --build-arg "API_URL=https://${FQDN}" \
            .

      # Ensure the Container App can pull from ACR via its system-assigned identity.
      # This is idempotent — safe to run on every deploy.
      - name: Grant AcrPull to Container App managed identity
        run: |
          ACR_ID=$(az acr show \
            --name "${{ secrets.ACR_NAME }}" \
            --query "id" --output tsv)
          echo "ACR resource ID: $ACR_ID"
          PRINCIPAL_ID=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "identity.principalId" --output tsv)
          echo "Container App principal ID: $PRINCIPAL_ID"

          EXISTING_ASSIGN_COUNT=$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_ID" \
            --scope "$ACR_ID" \
            --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
            -o tsv)

          if [[ "$EXISTING_ASSIGN_COUNT" -ge 1 ]]; then
            echo "AcrPull already assigned; skipping role assignment create."
          else
            echo "AcrPull not found; attempting to create role assignment..."
          set +e
          ASSIGN_OUT=$(az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "AcrPull" \
            --scope "$ACR_ID" 2>&1)
          ASSIGN_CODE=$?
          set -e

          if [[ $ASSIGN_CODE -ne 0 ]]; then
            if echo "$ASSIGN_OUT" | grep -qi "RoleAssignmentExists"; then
              echo "Role assignment already exists, skipping."
            else
              echo "$ASSIGN_OUT"
              echo "ERROR: Failed to create AcrPull role assignment."
              echo "This CI identity does not have Microsoft.Authorization/roleAssignments/write."
              echo "Grant User Access Administrator/Owner on the ACR scope, or pre-create AcrPull manually."
              exit 1
            fi
          else
            echo "$ASSIGN_OUT"
          fi
          fi

          echo "Waiting for AcrPull assignment visibility in ARM..."
          for i in $(seq 1 30); do
            ASSIGN_COUNT=$(az role assignment list \
              --assignee-object-id "$PRINCIPAL_ID" \
              --scope "$ACR_ID" \
              --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
              -o tsv)
            echo "  [${i}/30] AcrPull assignment count: ${ASSIGN_COUNT}"
            if [[ "$ASSIGN_COUNT" -ge 1 ]]; then
              break
            fi
            sleep 10
          done

          FINAL_ASSIGN_COUNT=$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_ID" \
            --scope "$ACR_ID" \
            --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
            -o tsv)
          if [[ "$FINAL_ASSIGN_COUNT" -lt 1 ]]; then
            echo "ERROR: AcrPull role assignment is still missing after waiting."
            exit 1
          fi

      - name: Deploy to Azure Container App
        run: |
          APP="${{ secrets.AZURE_CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          ACR_SERVER="${{ secrets.ACR_NAME }}.azurecr.io"
          IMAGE="$ACR_SERVER/pp-agent-toolkit:${{ github.sha }}"
          echo "Deploying image: $IMAGE"

          wait_for_stable() {
            local max_tries="$1"
            local sleep_seconds="$2"
            for i in $(seq 1 "$max_tries"); do
              STATE=$(az containerapp show \
                --name "$APP" \
                --resource-group "$RG" \
                --query "properties.provisioningState" \
                -o tsv)
              echo "  [${i}/${max_tries}] provisioningState=$STATE"
              if [[ "$STATE" != "InProgress" ]]; then
                return 0
              fi
              sleep "$sleep_seconds"
            done
            return 1
          }

          echo "Waiting for any prior Container App operation to finish..."
          if ! wait_for_stable 60 10; then
            echo "ERROR: Container App is still locked in provisioning after 10 minutes."
            az containerapp revision list \
              --name "$APP" \
              --resource-group "$RG" \
              --query "[].{revision:name,health:properties.healthState,running:properties.runningState,created:properties.createdTime}" \
              --output table || true
            exit 1
          fi

          CURRENT_REGISTRY=$(az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query "properties.configuration.registries[0].server" \
            -o tsv 2>/dev/null || true)

          if [[ "$CURRENT_REGISTRY" != "$ACR_SERVER" ]]; then
            echo "Configuring Container App registry to $ACR_SERVER"
            az containerapp registry set \
              --name "$APP" \
              --resource-group "$RG" \
              --server "$ACR_SERVER" \
              --identity system

            echo "Waiting for registry configuration provisioning to finish..."
            if ! wait_for_stable 60 10; then
              echo "ERROR: Registry update did not complete within 10 minutes."
              exit 1
            fi
          else
            echo "Container App already configured to use registry: $CURRENT_REGISTRY"
          fi

          for i in $(seq 1 20); do
            echo "Image update attempt ${i}/20"
            set +e
            UPDATE_OUT=$(az containerapp update \
              --name "$APP" \
              --resource-group "$RG" \
              --image "$IMAGE" 2>&1)
            UPDATE_CODE=$?
            set -e

            if [[ $UPDATE_CODE -eq 0 ]]; then
              echo "$UPDATE_OUT"
              echo "Image update succeeded."
              break
            fi

            echo "$UPDATE_OUT"
            if echo "$UPDATE_OUT" | grep -q "ContainerAppOperationInProgress"; then
              echo "Container App operation in progress. Waiting 20s before retry..."
              sleep 20
              if [[ "$i" -lt 20 ]]; then
                continue
              fi
            fi

            if echo "$UPDATE_OUT" | grep -q "unable to pull image using Managed identity system"; then
              echo "Managed identity pull permission may still be propagating. Waiting 30s before retry..."
              sleep 30
              if [[ "$i" -lt 20 ]]; then
                continue
              fi
            fi

            echo "ERROR: Image update failed."
            exit 1
          done

      # Poll until the new revision is healthy or fail with logs for debugging.
      - name: Wait for revision to become healthy
        run: |
          APP="${{ secrets.AZURE_CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          REVISION=$(az containerapp show \
            --name "$APP" --resource-group "$RG" \
            --query "properties.latestRevisionName" -o tsv)
          echo "Polling health of revision: $REVISION"
          for i in $(seq 1 24); do
            HEALTH=$(az containerapp revision show \
              --name "$APP" --resource-group "$RG" \
              --revision "$REVISION" \
              --query "properties.healthState" -o tsv 2>/dev/null || echo "Unknown")
            RUNNING=$(az containerapp revision show \
              --name "$APP" --resource-group "$RG" \
              --revision "$REVISION" \
              --query "properties.runningState" -o tsv 2>/dev/null || echo "Unknown")
            echo "  [${i}/24] healthState=$HEALTH  runningState=$RUNNING"
            if [[ "$HEALTH" == "Healthy" ]]; then
              echo "Revision is healthy."
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: Revision did not become healthy after 6 minutes."
          echo "--- Last 100 container log lines ---"
          az containerapp logs show \
            --name "$APP" --resource-group "$RG" \
            --tail 100 --follow false || true
          exit 1

      - name: Show active revision
        if: always()
        run: |
          az containerapp revision list \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "[].{revision:name, health:properties.healthState, running:properties.runningState, created:properties.createdTime}" \
            --output table
