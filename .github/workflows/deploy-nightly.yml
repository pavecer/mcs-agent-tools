name: Deploy Nightly

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub Environment to deploy"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

  schedule:
    - cron: "0 3 * * 1-5"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment || 'prod' }}-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight Checks
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment || 'prod' }}
    outputs:
      deploy: ${{ steps.time_gate.outputs.deploy }}
      target_env: ${{ steps.resolve_env.outputs.target_env }}
    steps:
      - name: Resolve deployment environment
        id: resolve_env
        run: |
          set -euo pipefail
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment || 'prod' }}"
          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "Target environment: ${TARGET_ENV}"

      - name: Enable deployment for manual run
        id: time_gate
        run: |
          set -euo pipefail
          echo "Deployment gate passed."
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Validate required environment secrets
        if: steps.time_gate.outputs.deploy == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          AUTH_DB_DSN: ${{ secrets.AUTH_DB_DSN }}
          AUTH_ADMIN_EMAIL: ${{ secrets.AUTH_ADMIN_EMAIL }}
          AUTH_ADMIN_PASSWORD: ${{ secrets.AUTH_ADMIN_PASSWORD }}
          ACS_EMAIL_CONNECTION_STRING: ${{ secrets.ACS_EMAIL_CONNECTION_STRING }}
          ACS_EMAIL_SENDER: ${{ secrets.ACS_EMAIL_SENDER }}
        run: |
          set -euo pipefail

          missing=0
          for key in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_CONTAINER_APP_NAME \
            AZURE_RESOURCE_GROUP \
            ACR_NAME; do
            if [[ -z "${!key:-}" ]]; then
              echo "ERROR: Missing required prod environment secret: ${key}"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Preflight failed. Configure missing secrets in GitHub Environment '${{ steps.resolve_env.outputs.target_env }}'."
            exit 1
          fi

          if [[ -n "${AUTH_DB_DSN:-}" ]]; then
            auth_missing=0
            for key in \
              AUTH_ADMIN_EMAIL \
              AUTH_ADMIN_PASSWORD; do
              if [[ -z "${!key:-}" ]]; then
                echo "ERROR: AUTH_DB_DSN requires prod secret: ${key}"
                auth_missing=1
              fi
            done

            if [[ "$auth_missing" -ne 0 ]]; then
              echo "Preflight failed for DB-backed authentication secrets."
              exit 1
            fi

            if [[ -n "${ACS_EMAIL_CONNECTION_STRING:-}" && -z "${ACS_EMAIL_SENDER:-}" ]]; then
              echo "ERROR: ACS_EMAIL_CONNECTION_STRING is set but ACS_EMAIL_SENDER is missing."
              exit 1
            fi

            if [[ -z "${ACS_EMAIL_CONNECTION_STRING:-}" && -n "${ACS_EMAIL_SENDER:-}" ]]; then
              echo "ERROR: ACS_EMAIL_SENDER is set but ACS_EMAIL_CONNECTION_STRING is missing."
              exit 1
            fi

            if [[ -n "${ACS_EMAIL_CONNECTION_STRING:-}" ]]; then
              lowered="${ACS_EMAIL_CONNECTION_STRING,,}"
              if [[ "$lowered" != *"endpoint="* || "$lowered" != *"accesskey="* ]]; then
                echo "ERROR: ACS_EMAIL_CONNECTION_STRING does not look valid (expected endpoint=...;accesskey=...)."
                exit 1
              fi
            fi

            if [[ -n "${ACS_EMAIL_SENDER:-}" ]]; then
              if [[ ! "${ACS_EMAIL_SENDER}" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
                echo "ERROR: ACS_EMAIL_SENDER does not look like a valid email address."
                exit 1
              fi
            fi
          fi

          echo "Preflight passed: required secrets are present and email settings are valid."

  deploy:
    name: Build & Deploy to Azure Container App
    if: needs.preflight.outputs.deploy == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.preflight.outputs.target_env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure CLI containerapp extension
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name containerapp --upgrade

      - name: Resolve app FQDN
        id: app
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          if [[ -z "${FQDN}" ]]; then
            echo "ERROR: Container App ingress FQDN is empty. Ensure ingress is enabled."
            exit 1
          fi

          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"
          echo "Container App FQDN: ${FQDN}"

      - name: Build & push image to ACR
        run: |
          set -euo pipefail
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "pp-agent-toolkit:${{ github.sha }}" \
            --image "pp-agent-toolkit:latest" \
            --build-arg "API_URL=https://${{ steps.app.outputs.fqdn }}" \
            .

      # Prerequisite: Container App managed identity must already have AcrPull on ACR.
      - name: Deploy image to Azure Container App
        run: |
          set -euo pipefail
          APP="${{ secrets.AZURE_CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          ACR_SERVER="${{ secrets.ACR_NAME }}.azurecr.io"
          IMAGE="${ACR_SERVER}/pp-agent-toolkit:${{ github.sha }}"

          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$IMAGE"

      - name: Sync optional auth and email secrets
        env:
          AUTH_DB_DSN: ${{ secrets.AUTH_DB_DSN }}
          AUTH_ADMIN_EMAIL: ${{ secrets.AUTH_ADMIN_EMAIL }}
          AUTH_ADMIN_PASSWORD: ${{ secrets.AUTH_ADMIN_PASSWORD }}
          ACS_EMAIL_CONNECTION_STRING: ${{ secrets.ACS_EMAIL_CONNECTION_STRING }}
          ACS_EMAIL_SENDER: ${{ secrets.ACS_EMAIL_SENDER }}
        run: |
          set -euo pipefail
          APP="${{ secrets.AZURE_CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"

          if [[ -z "${AUTH_DB_DSN:-}" ]]; then
            echo "AUTH_DB_DSN is not set. Skipping DB-backed auth/email sync."
            exit 0
          fi

          secret_args=("auth-db-dsn=${AUTH_DB_DSN}" "auth-admin-password=${AUTH_ADMIN_PASSWORD}")
          env_args=(
            "AUTH_DB_DSN=secretref:auth-db-dsn"
            "AUTH_ADMIN_EMAIL=${AUTH_ADMIN_EMAIL}"
            "AUTH_ADMIN_PASSWORD=secretref:auth-admin-password"
          )

          if [[ -n "${ACS_EMAIL_CONNECTION_STRING:-}" && -n "${ACS_EMAIL_SENDER:-}" ]]; then
            secret_args+=("acs-email-conn=${ACS_EMAIL_CONNECTION_STRING}" "acs-email-sender=${ACS_EMAIL_SENDER}")
            env_args+=("ACS_EMAIL_CONNECTION_STRING=secretref:acs-email-conn" "ACS_EMAIL_SENDER=secretref:acs-email-sender")
          fi

          az containerapp secret set \
            --name "$APP" \
            --resource-group "$RG" \
            --secrets "${secret_args[@]}"

          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --set-env-vars "${env_args[@]}"

      - name: Wait for healthy revision
        run: |
          set -euo pipefail
          APP="${{ secrets.AZURE_CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"

          REVISION=$(az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query "properties.latestRevisionName" -o tsv)

          echo "Polling revision health: ${REVISION}"
          for i in $(seq 1 24); do
            HEALTH=$(az containerapp revision show \
              --name "$APP" \
              --resource-group "$RG" \
              --revision "$REVISION" \
              --query "properties.healthState" -o tsv 2>/dev/null || echo "Unknown")
            RUNNING=$(az containerapp revision show \
              --name "$APP" \
              --resource-group "$RG" \
              --revision "$REVISION" \
              --query "properties.runningState" -o tsv 2>/dev/null || echo "Unknown")

            echo "[${i}/24] healthState=${HEALTH} runningState=${RUNNING}"
            if [[ "$HEALTH" == "Healthy" ]]; then
              echo "Revision is healthy."
              exit 0
            fi

            sleep 15
          done

          echo "ERROR: Revision did not become healthy after 6 minutes."
          az containerapp logs show \
            --name "$APP" \
            --resource-group "$RG" \
            --tail 100 --follow false || true
          exit 1

      - name: Show revisions
        if: always()
        run: |
          az containerapp revision list \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "[].{revision:name, health:properties.healthState, running:properties.runningState, created:properties.createdTime}" \
            --output table
