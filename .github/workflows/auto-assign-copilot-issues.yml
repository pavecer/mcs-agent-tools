name: Auto-Assign Issues To Copilot

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: read
  issues: write

jobs:
  assign-to-copilot:
    name: Assign bug/enhancement to Copilot
    runs-on: ubuntu-latest
    steps:
      - name: Route eligible issues
        uses: actions/github-script@v7
        env:
          # Set this to your Copilot assignee login if different in your org/repo.
          COPILOT_ASSIGNEE: copilot
        with:
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map((l) =>
              typeof l === "string" ? l.toLowerCase() : String(l.name || "").toLowerCase()
            );

            const isEligible = labels.includes("bug") || labels.includes("enhancement");
            if (!isEligible) {
              core.notice(`Issue #${issue.number} ignored: no bug/enhancement label.`);
              return;
            }

            if ((issue.assignees || []).length > 0) {
              core.notice(`Issue #${issue.number} already has assignees, skipping auto-assignment.`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;
            const assignee = process.env.COPILOT_ASSIGNEE || "copilot";

            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number,
                assignees: [assignee],
              });
              core.notice(`Assigned issue #${issue_number} to ${assignee}.`);
            } catch (error) {
              core.warning(`Could not assign issue #${issue_number} to ${assignee}: ${error.message}`);

              // Ensure fallback label exists.
              const fallbackLabel = "copilot-ready";
              try {
                await github.rest.issues.getLabel({ owner, repo, name: fallbackLabel });
              } catch {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: fallbackLabel,
                  color: "1D76DB",
                  description: "Issue is ready for Copilot coding agent handoff",
                });
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [fallbackLabel],
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body:
                  "Automatic Copilot assignment could not be completed. " +
                  "I added the `copilot-ready` label so this can be handed off manually to the Copilot coding agent.",
              });
            }
